<style>
  :root {
    --paper:  #fbf8f2;
    --ink:    #17130f;
    --red:    #a82a1c;
    --red-2:  #c9553f;
    --rule:   #d9d2c6;
    --muted:  #6f675c;
    --serif:  ui-serif, Georgia, "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
    --ui:     system-ui, -apple-system, "Segoe UI", "PingFang SC",
              "Microsoft YaHei", sans-serif;
    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14120f;
      --ink:   #efeae1;
      --red:   #e8836f;
      --red-2: #b8543f;
      --rule:  #34302a;
      --muted: #9a9186;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 2.5rem 1.25rem;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--ui);
    -webkit-font-smoothing: antialiased;
  }

  main { width: min(46rem, 100%); text-align: center; }

  /* ---- the card: a character in its practice grid, the way the site
         presents every character it teaches ---------------------------- */

  .grid {
    --size: clamp(9rem, 34vw, 13rem);
    position: relative;
    width: var(--size);
    height: var(--size);
    margin: 0 auto;
    border: 2px solid var(--red);
    display: grid;
    place-items: center;
  }

  /* dashed 田字格 guides */
  .grid::before,
  .grid::after {
    content: "";
    position: absolute;
    background-repeat: repeat;
    opacity: .75;
  }
  .grid::before {
    inset: 6% 50% 6% auto;
    width: 2px;
    transform: translateX(1px);
    background-image: repeating-linear-gradient(
      to bottom, var(--red-2) 0 9px, transparent 9px 17px);
  }
  .grid::after {
    inset: 50% 6% auto 6%;
    height: 2px;
    transform: translateY(-1px);
    background-image: repeating-linear-gradient(
      to right, var(--red-2) 0 9px, transparent 9px 17px);
  }

  .hanzi {
    position: relative;
    display: block;
    font-family: var(--serif);
    font-size: calc(var(--size) * .72);
    line-height: 1;
    animation: ink 900ms cubic-bezier(.22, .9, .3, 1) both;
  }

  /* the character inks in from the top, the way a brush lays it down */
  @keyframes ink {
    from { clip-path: inset(0 0 100% 0); opacity: .25; }
    to   { clip-path: inset(0 0 0 0);    opacity: 1; }
  }

  .gloss {
    margin: .9rem 0 0;
    font-family: var(--serif);
    font-size: 1.05rem;
    color: var(--muted);
  }
  .gloss b { color: var(--ink); font-weight: 600; font-style: italic; }

  /* ---- message ----------------------------------------------------- */

  .code {
    margin: 2.4rem 0 0;
    font-size: .78rem;
    letter-spacing: .22em;
    color: var(--red);
    font-weight: 600;
  }

  h1 {
    margin: .5rem 0 0;
    font-family: var(--serif);
    font-size: clamp(1.7rem, 5vw, 2.4rem);
    font-weight: 600;
    letter-spacing: -.01em;
  }

  p.say {
    margin: .85rem auto 0;
    max-width: 34rem;
    font-size: 1.02rem;
    line-height: 1.65;
    color: var(--muted);
  }

  /* ---- links ------------------------------------------------------- */

  nav {
    margin-top: 2.1rem;
    padding-top: 1.6rem;
    border-top: 1px solid var(--rule);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: .5rem .35rem;
  }

  nav a {
    padding: .5rem .85rem;
    border-radius: 999px;
    color: var(--ink);
    text-decoration: none;
    font-size: .95rem;
    border: 1px solid transparent;
    transition: background-color .15s, border-color .15s, color .15s;
  }
  nav a:hover { background: color-mix(in srgb, var(--red) 10%, transparent);
                color: var(--red); }
  nav a.home { border-color: var(--red); color: var(--red); font-weight: 600; }
  nav a.home:hover { background: var(--red); color: var(--paper); }

  a:focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 3px;
  }

  footer {
    margin-top: 2.2rem;
    font-size: .85rem;
    color: var(--muted);
  }
  footer a { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .hanzi { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>

<body>

</main>
