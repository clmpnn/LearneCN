<!--
  writing.html only — stroke paths come from jsDelivr, so open the connection
  during page parse rather than at first trace. Put these as high in <head> as
  you can; a preconnect is only worth having if it happens early.
-->
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
