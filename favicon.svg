<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="LearneCN">
  <title>LearneCN</title>

  <!-- 田字格: the practice grid the whole site is built around -->
  <rect width="32" height="32" rx="6.5" fill="#a82a1c"/>

  <!-- guide lines, kept faint so they read as paper ruling, not as content -->
  <g stroke="#ffffff" stroke-opacity="0.34" stroke-width="1.1">
    <path d="M16 3.5V28.5"/>
    <path d="M3.5 16H28.5"/>
  </g>

  <!-- 一笔: one stroke, a 丿 falling left, the site's first lesson -->
  <path d="M21.6 8.2Q17.8 16.4 10.2 23.4"
        fill="none" stroke="#ffffff" stroke-width="3.7"
        stroke-linecap="round"/>
</svg>
